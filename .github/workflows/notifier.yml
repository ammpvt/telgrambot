name: Uni Announcement Bot

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes (UTC, may run a few minutes late during high load)
  workflow_dispatch:          # lets you trigger it manually from the Actions tab too

jobs:
  check-announcements:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
        run: python telgramktu.py
